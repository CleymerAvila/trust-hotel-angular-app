<div class="h-[90px] flex p-5 justify-between items-center bg-blue-300">
  <div class="flex flex-col gap-1">
    <h1 class="text-lg md:text-2xl font-bold text-black">
      {{ envs.companyName }}<span class="text-blue-500"> {{ envs.companyName2 }}</span>.
    </h1>
    <p class="text-slate-500 text-sm">{{ envs.companySlogan }}</p>
  </div>
  <p class="font-bold text-black"> {{ currentDate | date:'fullDate':'':'es' }}</p>

  <div class="flex flex-row gap-4  bg-transparent">
      <img src="https://thumbs.dreamstime.com/b/default-avatar-profile-icon-vector-social-media-user-portrait-176256935.jpg" alt="Logo" class="w-10 h-10 rounded-full ">
      <button (click)="authService.logout()" class=" bg-sky-400 p-1 rounded-xl hover:transition-transform duration-300"> Logout</button>
  </div>

</div>
